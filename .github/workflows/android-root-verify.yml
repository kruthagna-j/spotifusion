name: SpotiFusion Android Root Verify

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - ".github/workflows/android-root-verify.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - ".github/workflows/android-root-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK exists
        run: test -f app/build/outputs/apk/debug/app-debug.apk
