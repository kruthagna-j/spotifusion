name: Build Spotifusion Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spotifusion-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --warning-mode all

      - name: Create temporary CI signing key
        env:
          STORE_PASSWORD: spotifusion-ci-build
          KEY_PASSWORD: spotifusion-ci-build
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/spotifusion-ci.jks" \
            -alias spotifusion \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=Spotifusion CI, OU=Android, O=Spotifusion, L=Kurnool, ST=Andhra Pradesh, C=IN"

      - name: Align and sign release APK
        env:
          STORE_PASSWORD: spotifusion-ci-build
          KEY_PASSWORD: spotifusion-ci-build
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED=$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name 'spotifusion-release.apk' | head -n 1)
          test -n "$UNSIGNED"
          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" "$RUNNER_TEMP/spotifusion-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/spotifusion-ci.jks" \
            --ks-key-alias spotifusion \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out android/app/build/outputs/apk/release/spotifusion-release.apk \
            "$RUNNER_TEMP/spotifusion-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose android/app/build/outputs/apk/release/spotifusion-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: spotifusion-release-apk
          path: android/app/build/outputs/apk/release/spotifusion-release.apk
          if-no-files-found: error
