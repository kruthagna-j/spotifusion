name: SpotiFusion Current Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - ".github/workflows/android-root-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - ".github/workflows/android-root-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-root-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Create temporary release signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/spotifusion-release.jks" -storepass spotifusion-ci -alias upload -keypass spotifusion-ci -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Spotifusion CI, OU=Android, O=Spotifusion, L=Kurnool, ST=Andhra Pradesh, C=IN"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/spotifusion-release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=spotifusion-ci" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=spotifusion-ci" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: Verify APKs
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk
      - name: Upload current AI Studio APKs
        uses: actions/upload-artifact@v4
        with:
          name: spotifusion-current-android-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
