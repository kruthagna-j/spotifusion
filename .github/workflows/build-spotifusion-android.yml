name: Build Spotifusion Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'Spotifusion_Android_WarmLight_FirebaseFixed_Final.zip'
      - '.github/workflows/build-spotifusion-android.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android project
        shell: bash
        run: |
          set -e
          if [ -f "android/settings.gradle.kts" ]; then
            echo "Using android/ project directory"
          elif [ -f "Spotifusion_Android_WarmLight_FirebaseFixed_Final.zip" ]; then
            rm -rf android
            mkdir -p android
            unzip -q "Spotifusion_Android_WarmLight_FirebaseFixed_Final.zip" -d android
          else
            echo "Android project not found. Add android/ or upload Spotifusion_Android_WarmLight_FirebaseFixed_Final.zip to the repository root."
            exit 1
          fi

      - name: Install required Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Spotifusion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
